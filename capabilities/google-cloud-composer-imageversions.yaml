naftiko: 1.0.0-alpha2
info:
  label: Google Cloud Composer API — ImageVersions
  description: 'Google Cloud Composer API — ImageVersions. 1 operations. Lead operation: Google Cloud Composer List image
    versions. Self-contained Naftiko capability covering one Google Cloud Composer business surface.'
  tags:
  - Google Cloud Composer
  - ImageVersions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GOOGLE_CLOUD_COMPOSER_API_KEY: GOOGLE_CLOUD_COMPOSER_API_KEY
capability:
  consumes:
  - type: http
    namespace: google-cloud-composer-imageversions
    baseUri: https://composer.googleapis.com/v1
    description: Google Cloud Composer API — ImageVersions business capability. Self-contained, no shared references.
    resources:
    - name: projects-projectId-locations-location-imageVersions
      path: /projects/{projectId}/locations/{location}/imageVersions
      operations:
      - name: listimageversions
        method: GET
        description: Google Cloud Composer List image versions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: projectId
          in: path
          type: string
          required: true
        - name: location
          in: path
          type: string
          required: true
        - name: pageSize
          in: query
          type: integer
        - name: pageToken
          in: query
          type: string
    authentication:
      type: bearer
      token: '{{env.GOOGLE_CLOUD_COMPOSER_API_KEY}}'
  exposes:
  - type: rest
    namespace: google-cloud-composer-imageversions-rest
    port: 8080
    description: REST adapter for Google Cloud Composer API — ImageVersions. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/projects/{projectid}/locations/{location}/imageversions
      name: projects-projectid-locations-location-imageversions
      description: REST surface for projects-projectId-locations-location-imageVersions.
      operations:
      - method: GET
        name: listimageversions
        description: Google Cloud Composer List image versions
        call: google-cloud-composer-imageversions.listimageversions
        with:
          projectId: rest.projectId
          location: rest.location
          pageSize: rest.pageSize
          pageToken: rest.pageToken
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: google-cloud-composer-imageversions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Google Cloud Composer API — ImageVersions. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: google-cloud-composer-list-image
      description: Google Cloud Composer List image versions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-cloud-composer-imageversions.listimageversions
      with:
        projectId: tools.projectId
        location: tools.location
        pageSize: tools.pageSize
        pageToken: tools.pageToken
      outputParameters:
      - type: object
        mapping: $.
